services:
  mongodb:
    image: mongo:4.4.6
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./app/backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      MONGO_CONN_STR: mongodb://mongodb:27017/tasks
    ports:
      - "8081:8080"
    depends_on:
      - mongodb

  frontend:
    build: ./app/frontend
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      REACT_APP_BACKEND_URL: http://localhost:8081/api/tasks
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo_data:
